# Optional: publish the app on the host when there is no reverse proxy in front.
#   docker compose -f docker-compose.yml -f docker-compose.ports.yml up -d
services:
  app:
    ports:
      - '${COOKIT_PORT:-3000}:3000'
    environment:
      # Reached directly: X-Forwarded-For could be forged, so rate limiting uses the socket address.
      TRUST_PROXY: 'false'
