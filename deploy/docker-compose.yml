# CookIt — production deployment: published image + PostgreSQL.
#
# No host port is published: a reverse proxy (Coolify, Traefik, Caddy…) routes the traffic
# to the `app` service on port 3000.
#
#
#   Without a proxy, also publish the port:
#     cp .env.example .env    # then set POSTGRES_PASSWORD (and COOKIT_VERSION)
#     docker compose -f docker-compose.yml -f docker-compose.ports.yml up -d

services:
  app:
    image: shiyamii/cookit:${COOKIT_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cookit}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cookit}
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    # The image has its own HEALTHCHECK on /healthz (database included).

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cookit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cookit}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published on the host: only the app reaches the database.

volumes:
  # All CookIt state lives here: back it up (e.g. Coolify's database backups or pg_dump).
  db-data:
