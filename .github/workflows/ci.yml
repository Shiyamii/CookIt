name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow: a version is only tagged and published after this passes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  docker:
    name: Docker image + end-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cookit
          POSTGRES_PASSWORD: cookit
          POSTGRES_DB: cookit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookit -d cookit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cookit:ci .
      - name: Start container
        run: >
          docker run -d --name cookit --network host
          -e DATABASE_URL=postgres://cookit:cookit@localhost:5432/cookit
          -e ORIGIN=http://localhost:3000
          -e BETTER_AUTH_SECRET=ci-secret-not-used-anywhere-else-0123456789
          -e RATE_LIMIT_FACTOR=50
          cookit:ci
      - name: Wait for the app
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 1
          done
          exit 1
      - name: Check migrations were applied
        env:
          PGPASSWORD: cookit
        run: |
          applied=$(psql -h localhost -U cookit -d cookit -tAc "select count(*) from drizzle.__drizzle_migrations")
          expected=$(find apps/server/drizzle -maxdepth 1 -name "*.sql" | wc -l)
          echo "applied=$applied expected=$expected"
          test "$applied" = "$expected"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        env:
          # The global setup runs the rescue CLI in this container to get the first-admin link.
          E2E_CONTAINER: cookit
        run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Container logs
        if: always()
        run: docker logs cookit
