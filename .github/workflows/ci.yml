name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cookit
          POSTGRES_PASSWORD: cookit
          POSTGRES_DB: cookit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookit -d cookit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cookit:ci .
      - name: Start container
        run: >
          docker run -d --name cookit --network host
          -e DATABASE_URL=postgres://cookit:cookit@localhost:5432/cookit
          cookit:ci
      - name: Check /healthz, API and SPA
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/api/v1/meta
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/some/client/route | grep -q '<div id="root">'
      - name: Check migrations were applied
        env:
          PGPASSWORD: cookit
        run: |
          applied=$(psql -h localhost -U cookit -d cookit -tAc "select count(*) from drizzle.__drizzle_migrations")
          expected=$(ls apps/server/drizzle/*.sql | wc -l)
          echo "applied=$applied expected=$expected"
          test "$applied" = "$expected"
      - name: Container logs
        if: always()
        run: docker logs cookit
