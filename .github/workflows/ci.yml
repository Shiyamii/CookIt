name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow: a version is only tagged and published after this passes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Empty when the release workflow calls this one, or on a pull request from a fork.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      # Unit test coverage (pure logic only: the server and the pages are covered by Playwright),
      # and each test's result for Codecov Test Analytics (flaky, slow and failing tests).
      - run: >
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov
          --reporter=junit --reporter-outfile=reports/junit-unit.xml
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: Upload unit test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          report_type: test_results
          files: reports/junit-unit.xml
          flags: unit
          fail_ci_if_error: false
      - run: bun run build

  docker:
    name: Docker image + end-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cookit
          POSTGRES_PASSWORD: cookit
          POSTGRES_DB: cookit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookit -d cookit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Catches the emails the app sends; the tests read them through its API.
      mailpit:
        image: axllent/mailpit:v1.27.0
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cookit:ci .
      - name: Start container
        run: >
          docker run -d --name cookit --network host
          -e DATABASE_URL=postgres://cookit:cookit@localhost:5432/cookit
          -e ORIGIN=http://localhost:3000
          -e BETTER_AUTH_SECRET=ci-secret-not-used-anywhere-else-0123456789
          -e RATE_LIMIT_FACTOR=50
          -e VAPID_PUBLIC_KEY=BDAjrN6hd_Hc2OHdE4nTIkhbrxCeqaWwfmbDbbbaT8CNS2jjPYZqqSZMkYles-Qon2UFknP0Gj47chgAx4ThjDI
          -e VAPID_PRIVATE_KEY=zQTQQENw_38kQ1zDvLJrGKyd8S4RW1cVT5joaH1Ovkc
          -e VAPID_SUBJECT=mailto:ci@example.com
          -e PUSH_TEST_ENDPOINT_ORIGIN=http://localhost:4567
          -e SMTP_HOST=localhost
          -e SMTP_PORT=1025
          -e SMTP_SECURITY=none
          -e "SMTP_FROM=CookIt <cookit@localhost>"
          cookit:ci
      - name: Wait for the app
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 1
          done
          exit 1
      - name: Check migrations were applied
        env:
          PGPASSWORD: cookit
        run: |
          applied=$(psql -h localhost -U cookit -d cookit -tAc "select count(*) from drizzle.__drizzle_migrations")
          expected=$(find apps/server/drizzle -maxdepth 1 -name "*.sql" | wc -l)
          echo "applied=$applied expected=$expected"
          test "$applied" = "$expected"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        env:
          # The global setup runs the rescue CLI in this container to get the first-admin link.
          E2E_CONTAINER: cookit
          # The push sink as the app container sees it (host network).
          E2E_PUSH_ORIGIN: http://localhost:4567
        run: bun run test:e2e
      # Every run (not only failures): traces and durations of passing runs are useful too.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload end-to-end test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          report_type: test_results
          files: reports/junit-e2e.xml
          flags: e2e
          fail_ci_if_error: false
      - name: Container logs
        if: always()
        run: docker logs cookit
