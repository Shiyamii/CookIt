services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cookit
      POSTGRES_PASSWORD: cookit
      POSTGRES_DB: cookit
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cookit -d cookit']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://cookit:cookit@db:5432/cookit
      ORIGIN: http://localhost:3000
      BETTER_AUTH_SECRET: dev-secret-change-me-dev-secret-change-me
      # End-to-end tests all come from one IP: loosen the rate limits (never in production).
      RATE_LIMIT_FACTOR: '50'
      # Development keys only (refused with an https ORIGIN).
      VAPID_PUBLIC_KEY: BDAjrN6hd_Hc2OHdE4nTIkhbrxCeqaWwfmbDbbbaT8CNS2jjPYZqqSZMkYles-Qon2UFknP0Gj47chgAx4ThjDI
      VAPID_PRIVATE_KEY: zQTQQENw_38kQ1zDvLJrGKyd8S4RW1cVT5joaH1Ovkc
      VAPID_SUBJECT: mailto:dev@example.com
      # End-to-end tests: the push sink run by Playwright on the host (never in production).
      PUSH_TEST_ENDPOINT_ORIGIN: http://host.docker.internal:4567
      # Emails go to Mailpit (a local catcher, never in production): read them at
      # http://localhost:8025. No TLS on the local network only.
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURITY: none
      SMTP_FROM: CookIt <cookit@localhost>
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Development and end-to-end tests only: catches every email (web UI and API on :8025).
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - '8025:8025'

volumes:
  db-data:
