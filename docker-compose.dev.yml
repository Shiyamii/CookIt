services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cookit
      POSTGRES_PASSWORD: cookit
      POSTGRES_DB: cookit
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cookit -d cookit']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://cookit:cookit@db:5432/cookit
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
